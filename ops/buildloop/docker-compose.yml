# The BuildLoop stack on `mkt-vps`: a vanilla Postgres, the MCP server and the
# functions runtime. Standalone on purpose — there is no upstream compose left
# to overlay, and with it goes the COMPOSE_FILE trap that silently disabled an
# override (AD-005, and the `compose-file-no-env-desliga-o-override` memory).
#
#  - every published surface stays on loopback; Traefik is the only way in
#  - every container has an explicit mem_limit, the convention of this box
#  - `internal` has no route to the internet: the database is reachable from
#    the two services and from nothing else
#  - the runtime runs OTHER PEOPLE'S CODE: read_only, no capability, no admin
#    key, no signing key. What it may ask the MCP is `/admin/runtime/*` only
services:
  db:
    image: postgres:16
    container_name: buildloop-db
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: buildloop_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - buildloop_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildloop_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      internal: {}

  # The collaborator reaches their database through this, and the connection
  # string never leaves the container.
  mcp:
    image: stl-buildloop-mcp:${MCP_IMAGE_TAG:-0.4.0}
    container_name: buildloop-mcp
    restart: unless-stopped
    mem_limit: 192m
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      ADMIN_DB_URL: postgres://buildloop_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      ADMIN_KEY: ${MCP_ADMIN_KEY}
      CREDENTIALS_KEY: ${MCP_CREDENTIALS_KEY}
      RUNTIME_KEY: ${RUNTIME_KEY}
      FUNCTIONS_URL: http://functions:8300
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      web: {}
    labels:
      # /admin is deliberately NOT routed: loopback and the internal network
      # only. The MCP authenticates every request with its own bearer, so no
      # basic auth is injected here.
      traefik.enable: "true"
      traefik.docker.network: "root_default"
      traefik.http.routers.blmcp.rule: 'Host(`${BUILDLOOP_HOST}`) && PathPrefix(`/mcp`)'
      traefik.http.routers.blmcp.entrypoints: "websecure"
      traefik.http.routers.blmcp.tls: "true"
      traefik.http.routers.blmcp.priority: "130"
      traefik.http.services.blmcp.loadbalancer.server.port: "8200"

  # No ADMIN_KEY, no CREDENTIALS_KEY, no signing key: this one holds the PUBLIC
  # half of the identity pair and a key that opens `/admin/runtime/*` alone.
  functions:
    image: stl-buildloop-functions:${FUNCTIONS_IMAGE_TAG:-0.1.0}
    container_name: buildloop-functions
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/fn:mode=1700,size=64m
      - /tmp:mode=1777,size=16m
    environment:
      PORT: "8300"
      MCP_URL: http://mcp:8200
      RUNTIME_KEY: ${RUNTIME_KEY}
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      web: {}
    labels:
      traefik.enable: "true"
      traefik.docker.network: "root_default"
      traefik.http.routers.blfn.rule: 'Host(`${BUILDLOOP_HOST}`) && (PathPrefix(`/fn/`) || PathPrefix(`/auth/`))'
      traefik.http.routers.blfn.entrypoints: "websecure"
      traefik.http.routers.blfn.tls: "true"
      traefik.http.routers.blfn.priority: "120"
      traefik.http.services.blfn.loadbalancer.server.port: "8300"

volumes:
  buildloop_db:

networks:
  # No route out: the database answers the two services and nobody else.
  internal:
    internal: true
  web:
    external: true
    name: root_default
